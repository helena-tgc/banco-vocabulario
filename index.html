  {id:277, palabra:"caricatura", tipo:"s.f.", cat:"lit", bloque:"Descripción", semana:1, def:"Descripción que exagera o deforma los rasgos de un personaje con intención satírica o crítica.", ej:"El autor recurre a la caricatura para ridiculizar a los personajes de la nobleza."},
  {id:278, palabra:"topografía (descriptiva)", tipo:"s.f.", cat:"lit", bloque:"Descripción", semana:2, def:"Descripción detallada de un lugar o un espacio.", ej:"La topografía del pueblo sitúa al lector en un ambiente rural y cerrado."},
  {id:279, palabra:"cronografía", tipo:"s.f.", cat:"lit", bloque:"Descripción", semana:3, def:"Descripción de una época, un momento histórico o un periodo temporal.", ej:"La cronografía inicial sitúa la acción en la España de posguerra."},
  {id:280, palabra:"estrofa", tipo:"s.f.", cat:"lit", bloque:"Métrica", semana:4, def:"Conjunto de versos que forman una unidad métrica y de sentido dentro de un poema.", ej:"El romance se compone de una única estrofa de dieciséis versos octosílabos."},
  {id:281, palabra:"verso libre", tipo:"loc.", cat:"lit", bloque:"Métrica", semana:1, def:"Verso que no se ajusta a un esquema fijo de métrica ni de rima.", ej:"El poema abandona la rima consonante y adopta el verso libre en su última parte."},
  {id:283, palabra:"estructura circular", tipo:"loc.", cat:"lit", bloque:"Estructura", semana:3, def:"Organización de un texto en la que el final retoma elementos, imágenes o ideas del principio.", ej:"La estructura circular del poema refuerza la sensación de destino ineludible."},
  {id:284, palabra:"paradoja", tipo:"s.f.", cat:"lit", bloque:"Figuras retóricas", semana:4, def:"Figura que reúne dos ideas aparentemente contradictorias que, juntas, encierran una verdad más profunda.", ej:"La paradoja del amor como prisión estructura buena parte de la poesía cortesana."},
  {id:285, palabra:"relación título-texto", tipo:"loc.", cat:"lit", bloque:"Otros", semana:1, def:"Vínculo de sentido entre el título de una obra y su contenido, que orienta la interpretación global del texto.", ej:"La relación título-texto cobra sentido solo al final, cuando se revela su valor simbólico."},
  {id:286, palabra:"tono", tipo:"s.m.", cat:"lit", bloque:"Otros", semana:2, def:"Actitud afectiva del emisor ante lo que expresa (melancólico, irónico, solemne...), perceptible en el conjunto del texto.", ej:"El tono nostálgico domina el relato, incluso en los pasajes más duros."},
  {id:287, palabra:"acrecentar", tipo:"v. tr.", cat:"verbos", bloque:"Intensificar o atenuar", semana:1, def:"Aumentar o intensificar una cualidad o un efecto.", ej:"La rima aguda acrecienta la musicalidad del poema."},
  {id:288, palabra:"agudizar", tipo:"v. tr.", cat:"verbos", bloque:"Intensificar o atenuar", semana:2, def:"Intensificar o hacer más aguda una sensación o un sentimiento.", ej:"El valor durativo del verbo agudiza el sentimiento de angustia del hablante."},
  {id:289, palabra:"acentuar", tipo:"v. tr.", cat:"verbos", bloque:"Intensificar o atenuar", semana:3, def:"Poner de relieve o intensificar un rasgo o un contraste.", ej:"El cambio brusco de tono acentúa el contraste semántico entre las dos partes."},
  {id:290, palabra:"sumir", tipo:"v. tr.", cat:"verbos", bloque:"Intensificar o atenuar", semana:4, def:"Hacer caer a alguien o algo en un determinado estado, generalmente negativo.", ej:"La muerte del ave sume al prisionero en la soledad."},
  {id:291, palabra:"dotar (de)", tipo:"loc. v.", cat:"verbos", bloque:"Intensificar o atenuar", semana:1, def:"Proveer a un texto o a un personaje de una cualidad o un rasgo determinado.", ej:"Las figuras de repetición dotan al poema de un fuerte sabor popular."},
  {id:292, palabra:"asomar", tipo:"v. tr.", cat:"verbos", bloque:"Mostrar y revelar", semana:2, def:"Manifestarse o aparecer de forma progresiva un rasgo dentro de un texto.", ej:"Desde el principio del párrafo asoma la primera persona del singular."},
  {id:293, palabra:"disimular", tipo:"v. tr.", cat:"verbos", bloque:"Intensificar o atenuar", semana:3, def:"Ocultar o atenuar deliberadamente un rasgo, como la subjetividad, mediante recursos lingüísticos.", ej:"El autor disimula su subjetividad con procedimientos propios de la función representativa."},
  {id:294, palabra:"primar", tipo:"v. tr.", cat:"verbos", bloque:"Intensificar o atenuar", semana:4, def:"Predominar o tener mayor peso un elemento sobre otro.", ej:"En el ensayo prima el fondo sobre la forma, aunque la función poética también está presente."},
  {id:295, palabra:"embellecer", tipo:"v. tr.", cat:"verbos", bloque:"Intensificar o atenuar", semana:1, def:"Dotar a un texto de belleza formal mediante recursos literarios.", ej:"La autora utiliza recursos literarios para embellecer el texto y darle mayor fuerza expresiva."},
  {id:296, palabra:"impactar", tipo:"v. tr.", cat:"verbos", bloque:"Intensificar o atenuar", semana:2, def:"Producir un efecto intenso o llamativo en el receptor.", ej:"La imagen busca impactar estéticamente al lector."},
  {id:297, palabra:"guardar relación (con)", tipo:"loc. v.", cat:"verbos", bloque:"Relacionar y estructurar", semana:3, def:"Mantener una conexión de sentido, forma o estructura con otro elemento del texto.", ej:"Los versos tercero y cuarto guardan entre sí un paralelismo semántico."},
  {id:298, palabra:"quedar patente / reforzado", tipo:"loc. v.", cat:"verbos", bloque:"Mostrar y revelar", semana:4, def:"Hacerse evidente o intensificarse un rasgo a lo largo del texto.", ej:"La subjetividad del emisor queda patente desde el principio y queda reforzada por el léxico connotativo."},
  {id:299, palabra:"perseguir", tipo:"v. tr.", cat:"verbos", bloque:"Argumentar y valorar", semana:1, def:"Tener como objetivo o propósito comunicativo, frecuentemente con valor argumentativo.", ej:"La autora persigue dos intenciones: dar su opinión y apelar a la razón del lector."},
  {id:300, palabra:"antitético/a", tipo:"adj.", cat:"adj", semana:1, def:"Que se opone o contrasta radicalmente con otro elemento del texto.", ej:"Las dos partes del romance son antitéticas: la alegría de mayo frente a la tristeza de la prisión."},
  {id:301, palabra:"expresivo/a", tipo:"adj.", cat:"adj", semana:2, def:"Que transmite con fuerza un sentimiento o una actitud subjetiva.", ej:"El cambio brusco de registro resulta extraordinariamente expresivo."},
  {id:302, palabra:"doloroso/a", tipo:"adj.", cat:"adj", semana:3, def:"Que produce o transmite dolor, tristeza o pesar.", ej:"El imperfecto 'cantaba' contrasta dolorosamente con el presente que lo precede."},
  {id:303, palabra:"brusco/a", tipo:"adj.", cat:"adj", semana:4, def:"Que se produce de forma repentina y marcada, sin transición.", ej:"El cambio brusco de tono señala el paso de la descripción al lamento."},
  {id:304, palabra:"afectivo/a", tipo:"adj.", cat:"adj", semana:1, def:"Que expresa cercanía emocional o carga sentimental.", ej:"El diminutivo 'avecilla' tiene un valor afectivo que intensifica la pérdida."},
  {id:305, palabra:"distanciador/a", tipo:"adj.", cat:"adj", semana:2, def:"Que crea distancia entre el emisor y lo enunciado, propio de un enfoque objetivo.", ej:"La tercera persona distanciadora refuerza el valor enunciativo-declarativo del texto."},
  {id:306, palabra:"fiable", tipo:"adj.", cat:"adj", semana:3, def:"Digno de confianza, dicho de una fuente o un dato.", ej:"Los datos proceden de una fuente fiable, lo que refuerza el argumento de autoridad."},
  {id:307, palabra:"sutil", tipo:"adj.", cat:"adj", semana:4, def:"Que se manifiesta de manera delicada o poco evidente, sin resultar directo.", ej:"La función metalingüística aparece de manera sutil, casi imperceptible."},
  {id:308, palabra:"imperceptible", tipo:"adj.", cat:"adj", semana:1, def:"Que apenas puede percibirse o notarse a simple vista.", ej:"El guiño irónico resulta casi imperceptible en una primera lectura."},
  {id:309, palabra:"enfoque (objetivo/subjetivo)", tipo:"s.m.", cat:"ling", bloque:"Comunicación y funciones del lenguaje", semana:1, def:"Perspectiva desde la que el emisor presenta un tema: objetiva (distanciada, denotativa) o subjetiva (personal, valorativa).", ej:"El enfoque subjetivo se percibe en la primera persona y en los adjetivos valorativos."},
  {id:310, palabra:"texto informativo", tipo:"loc.", cat:"ling", bloque:"Tipología y finalidad textual", semana:2, def:"Texto cuya finalidad es dar noticia de un hecho de manera clara y, en apariencia, objetiva.", ej:"La noticia es el texto informativo por excelencia de la prensa escrita."},
  {id:311, palabra:"texto explicativo", tipo:"loc.", cat:"ling", bloque:"Tipología y finalidad textual", semana:3, def:"Texto cuya finalidad es indicar pautas o procedimientos o hacer comprensible un conocimiento.", ej:"El prospecto funciona como texto explicativo: detalla dosis, usos y precauciones."},
  {id:312, palabra:"texto persuasivo", tipo:"loc.", cat:"ling", bloque:"Tipología y finalidad textual", semana:4, def:"Texto cuya finalidad es convencer al receptor para que piense o actúe de una determinada manera.", ej:"El anuncio institucional es un texto persuasivo que busca modificar la conducta del receptor."},
  {id:313, palabra:"texto estético", tipo:"loc.", cat:"ling", bloque:"Tipología y finalidad textual", semana:1, def:"Texto cuya finalidad es crear mundos de ficción o belleza verbal; es la finalidad propia de la literatura.", ej:"El microrrelato, como texto estético, prioriza la forma sobre la información."},

const STORAGE_KEY = "tgc-vocab-progress-v1";

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveProgress(progress) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch (e) { /* almacenamiento no disponible */ }
}

let progress = loadProgress();

function isDominada(id) {
  return !!(progress[id] && progress[id].dominada);
}

function isARepasar(id) {
  return !!(progress[id] && progress[id].repasar);
}

function markARepasar(id) {
  if (!progress[id]) progress[id] = {};
  progress[id].dominada = false;
  progress[id].repasar = true;
  saveProgress(progress);
  updateBadge();
}

function toggleDominada(id) {
  if (!progress[id]) progress[id] = {};
  progress[id].dominada = !progress[id].dominada;
  if (progress[id].dominada) progress[id].repasar = false;
  saveProgress(progress);
  updateBadge();
}

function updateBadge() {
  const total = VOCAB.length;
  const done = VOCAB.filter(w => isDominada(w.id)).length;
  const pend = VOCAB.filter(w => isARepasar(w.id)).length;
  document.getElementById("progressBadge").textContent =
    `${done} / ${total} dominadas · ${pend} a repasar`;
}

let activeCat = "todas";
let searchQuery = "";

document.getElementById("catChips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  activeCat = chip.dataset.cat;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  renderConsulta();
});

document.getElementById("searchInput").addEventListener("input", (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  renderConsulta();
});

  lit: ["Figuras retóricas", "Narratología", "Personajes", "Teatro", "Descripción", "Métrica", "Estructura", "Otros"],

  verbos: ["Mostrar y revelar", "Intensificar o atenuar", "Relacionar y estructurar", "Argumentar y valorar"]
};

function wordCardHTML(w) {
  return `
    <div class="word-card" data-cat="${w.cat}">
      <div class="tab-mark"></div>
      <div class="word-card-head">
        <h3>${w.palabra}</h3>
        <span class="word-tipo">${w.tipo}</span>
      </div>
      <p class="word-def">${w.def}</p>
      <p class="word-ej">${w.ej}</p>
      <div class="word-meta">
        <span class="word-cat-label">${CAT_LABELS[w.cat]} · semana ${w.semana}</span>
        <button class="mark-btn ${isDominada(w.id) ? "dominada" : ""}" data-id="${w.id}">
          ${isDominada(w.id) ? "✓ dominada" : "marcar"}
        </button>
      </div>
    </div>
  `;
}

function groupedHTML(results, cat) {
  const groups = {};
  results.forEach(w => {
    const b = w.bloque || "Otros";
    if (!groups[b]) groups[b] = [];
    groups[b].push(w);
  });
  return BLOQUE_ORDER[cat]
    .filter(b => groups[b] && groups[b].length)
    .map(b => `
      <div class="block-heading">${b}</div>
      ${groups[b].map(wordCardHTML).join("")}
    `).join("");
}

function renderConsulta() {
  const grid = document.getElementById("cardGrid");
  let results = VOCAB.filter(w => {
    if (activeCat === "todas") return true;
    if (activeCat === "repasar") return isARepasar(w.id);
    return w.cat === activeCat;
  });
  if (searchQuery) {
    results = results.filter(w =>
      w.palabra.toLowerCase().includes(searchQuery) ||
      w.def.toLowerCase().includes(searchQuery)
    );
  }
  document.getElementById("resultCount").textContent =
    `${results.length} término${results.length === 1 ? "" : "s"}`;

  if (results.length === 0) {
    grid.innerHTML = activeCat === "repasar"
      ? `<div class="empty-state" style="grid-column:1/-1;">No tienes palabras pendientes. Se añaden aquí al pulsar «A repasar» en las fichas o al fallar una pregunta.</div>`
      : `<div class="empty-state" style="grid-column:1/-1;">No se ha encontrado ningún término con ese criterio.</div>`;
    return;
  }

  grid.innerHTML = BLOQUE_ORDER[activeCat]
    ? groupedHTML(results, activeCat)
    : results.map(wordCardHTML).join("");

  grid.querySelectorAll(".mark-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      toggleDominada(Number(btn.dataset.id));
      renderConsulta();
    });
  });
}

// ---------- Práctica semanal ----------
let activeWeek = 1;
let activeMode = "fichas";
let flashIndex = 0;
let flashFlipped = false;
let quizState = null;
let repasoState = null;

function weekWords(week) {
  return VOCAB.filter(w => w.semana === week);
}

function renderWeekPicker() {
  const picker = document.getElementById("weekPicker");
  picker.innerHTML = [1, 2, 3, 4].map(w => {
    const words = weekWords(w);
    const done = words.filter(x => isDominada(x.id)).length;
    return `
      <button class="week-btn ${w === activeWeek ? "active" : ""}" data-week="${w}">
        Semana ${w}
        <span class="week-progress">${done}/${words.length} dominadas</span>
      </button>
    `;
  }).join("");
  picker.querySelectorAll(".week-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeWeek = Number(btn.dataset.week);
      flashIndex = 0;
      flashFlipped = false;
      quizState = null;
      repasoState = null;
      renderWeekPicker();
      renderPractica();
    });
  });
}

document.querySelectorAll(".mode-switch button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-switch button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeMode = btn.dataset.mode;
    flashIndex = 0;
    flashFlipped = false;
    quizState = null;
    repasoState = null;
    renderPractica();
  });
});

function renderPractica() {
  const body = document.getElementById("practicaBody");
  document.getElementById("weekPicker").style.display = activeMode === "repasar" ? "none" : "";
  const words = weekWords(activeWeek);
  if (activeMode === "fichas") {
    renderFichas(body, words);
  } else if (activeMode === "quiz") {
    renderQuiz(body, words);
  } else if (activeMode === "repasar") {
    const pend = VOCAB.filter(w => isARepasar(w.id));
    if (pend.length === 0) {
      body.innerHTML = `<p class="empty-state">No tienes palabras pendientes. Se añaden aquí al pulsar «A repasar» en las fichas o al fallar una pregunta de la autoevaluación o del repaso acumulado.</p>`;
      return;
    }
    renderFichas(body, pend);
  } else {
    const cumulative = VOCAB.filter(w => w.semana <= activeWeek);
    renderRepaso(body, cumulative);
  }
}

function renderFichas(body, words) {
  if (flashIndex >= words.length) flashIndex = 0;
  const w = words[flashIndex];
  body.innerHTML = `
    <div class="flash-wrap">
      <p class="flash-progress">Ficha ${flashIndex + 1} de ${words.length} — ${activeMode === "repasar" ? "mis palabras para repasar (todas las semanas)" : "Semana " + activeWeek}</p>
      <div class="flashcard" id="flashcard">
        ${flashFlipped ? `
          <p class="back-def">${w.def}</p>
          <p class="back-ej">${w.ej}</p>
        ` : `
          <span class="cat-tag" style="color:var(--${catColorVar(w.cat)})">${CAT_LABELS[w.cat]}</span>
          <div class="front-word">${w.palabra}</div>
          <div class="front-tipo">${w.tipo}</div>
          <div class="flip-hint">Toca la tarjeta para ver la definición</div>
        `}
      </div>
      <div class="flash-controls">
        <button class="nav-btn" id="flashPrev">‹</button>
        <div class="judge-btns">
          <button class="btn-repasar" id="flashRepasar">A repasar</button>
          <button class="btn-se" id="flashSe">La sé</button>
        </div>
        <button class="nav-btn" id="flashNext">›</button>
      </div>
    </div>
  `;

  document.getElementById("flashcard").addEventListener("click", () => {
    flashFlipped = !flashFlipped;
    renderFichas(body, words);
  });
  document.getElementById("flashPrev").addEventListener("click", (e) => {
    e.stopPropagation();
    flashIndex = (flashIndex - 1 + words.length) % words.length;
    flashFlipped = false;
    renderFichas(body, words);
  });
  document.getElementById("flashNext").addEventListener("click", (e) => {
    e.stopPropagation();
    flashIndex = (flashIndex + 1) % words.length;
    flashFlipped = false;
    renderFichas(body, words);
  });
  document.getElementById("flashSe").addEventListener("click", (e) => {
    e.stopPropagation();
    if (!progress[w.id]) progress[w.id] = {};
    progress[w.id].dominada = true;
    progress[w.id].repasar = false;
    saveProgress(progress);
    updateBadge();
    flashFlipped = false;
    if (activeMode === "repasar") {
      renderPractica();
    } else {
      flashIndex = (flashIndex + 1) % words.length;
      renderFichas(body, words);
    }
    renderWeekPicker();
  });
  document.getElementById("flashRepasar").addEventListener("click", (e) => {
    e.stopPropagation();
    if (!progress[w.id]) progress[w.id] = {};
    progress[w.id].dominada = false;
    progress[w.id].repasar = true;
    saveProgress(progress);
    updateBadge();
    flashIndex = (flashIndex + 1) % words.length;
    flashFlipped = false;
    renderFichas(body, words);
    renderWeekPicker();
  });
}

function catColorVar(cat) {
  return { ling: "gold", lit: "slate", adj: "teal", conectores: "wine", verbos: "sage" }[cat] || "ink";
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuiz(words) {
  const questions = shuffle(words).slice(0, Math.min(10, words.length)).map(w => {
    const pool = words.filter(x => x.id !== w.id);
    const distractors = shuffle(pool).slice(0, 3);
    const options = shuffle([w, ...distractors]);
    return { word: w, options, answeredId: null };
  });
  return { questions, index: 0, score: 0 };
}

function renderQuiz(body, words) {
  if (words.length < 4) {
    body.innerHTML = `<p class="empty-state">Esta semana no tiene términos suficientes para la autoevaluación.</p>`;
    return;
  }
  if (!quizState) quizState = buildQuiz(words);

  if (quizState.index >= quizState.questions.length) {
    const pct = Math.round((quizState.score / quizState.questions.length) * 100);
    body.innerHTML = `
      <div class="quiz-wrap">
        <div class="quiz-card quiz-result">
          <div class="score">${quizState.score}/${quizState.questions.length}</div>
          <p class="score-label">${pct}% de aciertos — Semana ${activeWeek}</p>
          <button id="quizRetry">Repetir autoevaluación</button>
        </div>
      </div>
    `;
    document.getElementById("quizRetry").addEventListener("click", () => {
      quizState = buildQuiz(words);
      renderQuiz(body, words);
    });
    return;
  }

  const q = quizState.questions[quizState.index];
  const answered = q.answeredId !== null;

  body.innerHTML = `
    <div class="quiz-wrap">
      <p class="quiz-progress">Pregunta ${quizState.index + 1} de ${quizState.questions.length} — Semana ${activeWeek} · Aciertos: ${quizState.score}</p>
      <div class="quiz-card">
        <div class="quiz-prompt">
          <span class="cat-tag" style="color:var(--${catColorVar(q.word.cat)})">${CAT_LABELS[q.word.cat]}</span>
          ${q.word.def}
        </div>
        <div class="quiz-options">
          ${q.options.map(opt => {
            let cls = "";
            if (answered) {
              if (opt.id === q.word.id) cls = "correct";
              else if (opt.id === q.answeredId) cls = "incorrect";
            }
            return `<button class="quiz-option ${cls}" data-id="${opt.id}" ${answered ? "disabled" : ""}>${opt.palabra}</button>`;
          }).join("")}
        </div>
        ${answered && q.answeredId !== q.word.id ? `<p class="quiz-note">«${q.word.palabra}» se ha añadido a tus palabras para repasar.</p>` : ""}
        <button class="quiz-next" id="quizNext" style="${answered ? "display:inline-block;" : ""}">Siguiente</button>
      </div>
    </div>
  `;

  if (!answered) {
    body.querySelectorAll(".quiz-option").forEach(btn => {
      btn.addEventListener("click", () => {
        const chosenId = Number(btn.dataset.id);
        q.answeredId = chosenId;
        if (chosenId === q.word.id) quizState.score++;
        else markARepasar(q.word.id);
        renderQuiz(body, words);
      });
    });
  } else {
    document.getElementById("quizNext").addEventListener("click", () => {
      quizState.index++;
      renderQuiz(body, words);
    });
  }
}

function buildRepasoQuiz(words) {
  // Prioridad: 1) todas las marcadas "a repasar"; 2) el resto de no dominadas;
  // 3) con menor frecuencia, las dominadas (retención a largo plazo).
  const MAX = 12;
  const selected = shuffle(words.filter(w => isARepasar(w.id))).slice(0, MAX);
  const seen = new Set(selected.map(w => w.id));
  let pool = [];
  words.forEach(w => {
    if (seen.has(w.id)) return;
    const weight = isDominada(w.id) ? 1 : 3;
    for (let i = 0; i < weight; i++) pool.push(w);
  });
  pool = shuffle(pool);

  for (const w of pool) {
    if (selected.length >= MAX) break;
    if (!seen.has(w.id)) {
      seen.add(w.id);
      selected.push(w);
    }
  }

  const questions = shuffle(selected).map(w => {
    const distractorPool = words.filter(x => x.id !== w.id);
    const distractors = shuffle(distractorPool).slice(0, 3);
    const options = shuffle([w, ...distractors]);
    return { word: w, options, answeredId: null };
  });
  return { questions, index: 0, score: 0 };
}

function renderRepaso(body, words) {
  if (words.length < 4) {
    body.innerHTML = `<p class="empty-state">Necesitas haber trabajado al menos una semana con 4 términos para generar un repaso acumulado.</p>`;
    return;
  }
  if (!repasoState) repasoState = buildRepasoQuiz(words);

  const rangeLabel = activeWeek === 1 ? "semana 1" : `semanas 1 a ${activeWeek}`;

  if (repasoState.index >= repasoState.questions.length) {
    const pct = Math.round((repasoState.score / repasoState.questions.length) * 100);
    body.innerHTML = `
      <div class="quiz-wrap">
        <div class="quiz-card quiz-result">
          <div class="score">${repasoState.score}/${repasoState.questions.length}</div>
          <p class="score-label">${pct}% de aciertos — repaso acumulado (${rangeLabel})</p>
          <button id="repasoRetry">Generar otro repaso</button>
        </div>
      </div>
    `;
    document.getElementById("repasoRetry").addEventListener("click", () => {
      repasoState = buildRepasoQuiz(words);
      renderRepaso(body, words);
    });
    return;
  }

  const q = repasoState.questions[repasoState.index];
  const answered = q.answeredId !== null;

  body.innerHTML = `
    <div class="quiz-wrap">
      <p class="quiz-progress">Pregunta ${repasoState.index + 1} de ${repasoState.questions.length} — Repaso acumulado (${rangeLabel}) · Aciertos: ${repasoState.score}</p>
      <div class="quiz-card">
        <div class="quiz-prompt">
          <span class="cat-tag" style="color:var(--${catColorVar(q.word.cat)})">${CAT_LABELS[q.word.cat]} · semana ${q.word.semana}</span>
          ${q.word.def}
        </div>
        <div class="quiz-options">
          ${q.options.map(opt => {
            let cls = "";
            if (answered) {
              if (opt.id === q.word.id) cls = "correct";
              else if (opt.id === q.answeredId) cls = "incorrect";
            }
            return `<button class="quiz-option ${cls}" data-id="${opt.id}" ${answered ? "disabled" : ""}>${opt.palabra}</button>`;
          }).join("")}
        </div>
        ${answered && q.answeredId !== q.word.id ? `<p class="quiz-note">«${q.word.palabra}» se ha añadido a tus palabras para repasar.</p>` : ""}
        <button class="quiz-next" id="repasoNext" style="${answered ? "display:inline-block;" : ""}">Siguiente</button>
      </div>
    </div>
  `;

  if (!answered) {
    body.querySelectorAll(".quiz-option").forEach(btn => {
      btn.addEventListener("click", () => {
        const chosenId = Number(btn.dataset.id);
        q.answeredId = chosenId;
        if (chosenId === q.word.id) repasoState.score++;
        else markARepasar(q.word.id);
        renderRepaso(body, words);
      });
    });
  } else {
    document.getElementById("repasoNext").addEventListener("click", () => {
      repasoState.index++;
      renderRepaso(body, words);
    });
  }
}

// ---------- Init ----------
updateBadge();
renderConsulta();
renderWeekPicker();
renderPractica();
</script>
